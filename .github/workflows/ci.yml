name: C++ CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libyaml-cpp-dev libgtest-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      # Görev tanımı Madde 24: üretilen dosya yalnızca YAML olarak değil,
      # Compose dosyası olarak da geçerli olmalı.
      - name: Docker Compose integration test
        run: |
          set -euo pipefail
          cp test-data/full-compose.yml generated-compose.yml
          ./build/change-image generated-compose.yml custody-crypto custody/cus-crypto:0.17.0
          ./build/change-extra-host generated-compose.yml custody-crypto hsm01 10.10.10.20
          docker compose -f generated-compose.yml config > /dev/null
          echo "docker compose config accepted the generated file"

      # Görev tanımı Madde 25: satır kapsamı raporu (eşik %80).
      - name: Coverage
        run: ./scripts/coverage.sh 80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: results/coverage/coverage.csv
