services:
  web:
    build: .
    container_name: finanzas-web
    ports:
      - "8083:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - finance-network
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=finanzas

  db:
    image: mysql:8.0
    container_name: finanzas-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: finanzas
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - finance-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: finanzas-phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge

volumes:
  db_data:
