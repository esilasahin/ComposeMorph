services:
  postgres:
    image: postgres:16
    container_name: postgres-performance-indexes
    environment:
      POSTGRES_DB: perf_test_db
      POSTGRES_USER: perf_user
      POSTGRES_PASSWORD: perf_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf_user -d perf_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
