version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esg_audit_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - esg-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    ports:
      - '6379:6379'
    networks:
      - esg-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    networks:
      - esg-net
    volumes:
      - ./backend:/usr/src/app
      - ./uploads:/usr/src/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:4173'
    environment:
      - VITE_API_BASE_URL=http://localhost:3001/api
    depends_on:
      - backend
    networks:
      - esg-net
    volumes:
      - ./frontend:/usr/src/app

volumes:
  postgres-data:

networks:
  esg-net:
    driver: bridge
