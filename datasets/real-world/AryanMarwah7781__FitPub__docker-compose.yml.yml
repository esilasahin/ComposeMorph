
version: '3.8'

services:
  # Main FastAPI Application
  fitpub-api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitpub-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fitpub_dev_user:fitpub_dev_pass@postgres:5432/fitpub_dev_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - OPENAI_API_KEY=your-openai-api-key-here
      - LLM_PROVIDER=openai
      - OPENAI_MODEL=gpt-4o-mini
      - OPENAI_MAX_TOKENS=2000
      - OPENAI_TEMPERATURE=0.7
    volumes:
      - ./backend/app:/app/app  # Hot reload for development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - fitpub-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fitpub-postgres
    environment:
      POSTGRES_DB: fitpub_dev_db
      POSTGRES_USER: fitpub_dev_user
      POSTGRES_PASSWORD: fitpub_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitpub_dev_user -d fitpub_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitpub-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fitpub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - fitpub-network
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fitpub-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - fitpub-network
    restart: unless-stopped

# Persistent volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

# Custom network
networks:
  fitpub-network:
    driver: bridge
