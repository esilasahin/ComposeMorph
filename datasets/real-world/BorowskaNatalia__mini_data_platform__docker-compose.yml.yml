name: mini-data-platform

services:
  # Airflow
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}

      PROJECT_ROOT: ${PROJECT_ROOT}

      # MinIO / S3A (passed to task containers)
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: datalake

      # MLflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

      # Airflow user
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_FIRSTNAME: Airflow
      _AIRFLOW_WWW_USER_LASTNAME: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/project/spark_jobs
      - ./gx:/opt/project/gx
      - ./ml:/opt/project/ml
      - ./data:/opt/project/data
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/project/spark_jobs
      - ./gx:/opt/project/gx
      - ./ml:/opt/project/ml
      - ./data:/opt/project/data
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\"" ]
      interval: 20s
      timeout: 10s
      retries: 20

  airflow-worker:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/project/spark_jobs
      - ./gx:/opt/project/gx
      - ./ml:/opt/project/ml
      - ./data:/opt/project/data
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: celery worker
    healthcheck:
      test: [ "CMD-SHELL", "celery -A airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\" | grep -q pong" ]
      interval: 20s
      timeout: 10s
      retries: 20

  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/project/spark_jobs
      - ./gx:/opt/project/gx
      - ./ml:/opt/project/ml
      - ./data:/opt/project/data
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: triggerer
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\"" ]
      interval: 20s
      timeout: 10s
      retries: 20

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -lc " airflow db migrate && airflow users create
        --username ${AIRFLOW_ADMIN_USER}
        --password ${AIRFLOW_ADMIN_PASSWORD}
        --firstname Airflow
        --lastname Admin
        --role Admin
        --email admin@example.com || true
      "

  # MinIO (S3)
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 40

  # Auto-create bucket datalake
  minio-mc:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -lc " mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && mc mb -p local/datalake || true && mc anonymous set none local/datalake || true && echo 'MinIO bucket datalake is ready.' && tail -f /dev/null "
  
  # MLflow Tracking Server
  mlflow:
    image: python:3.11-slim
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5001:5000"
    command: >
      bash -lc "pip install --no-cache-dir mlflow==2.12.1 boto3 && exec mlflow server --host 0.0.0.0 --port 5000 --workers 1 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root s3://datalake/mlflow/"

    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000'); print('ok')\"" ]
      interval: 10s
      timeout: 5s
      retries: 30

  # Spark App Image

  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    environment:
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: datalake
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./spark_jobs:/opt/project/spark_jobs
      - ./gx:/opt/project/gx
      - ./ml:/opt/project/ml
      - ./data:/opt/project/data
      - ./.ivy2:/tmp/.ivy2
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command: [ "bash", "-lc", "sleep infinity" ]
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import pyspark; print('ok')\"" ]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  mlflow_data:
