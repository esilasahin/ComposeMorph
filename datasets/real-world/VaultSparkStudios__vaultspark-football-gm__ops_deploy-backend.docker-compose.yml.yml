name: franchise-architect-football-community

services:
  postgres:
    image: postgres:16
    container_name: franchise-architect-community-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deploy-path .env}
      POSTGRES_DB: community_stats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_admin -d community_stats"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - community_internal

  community-stats:
    image: ghcr.io/vaultsparkstudios/franchise-architect-football-api:${IMAGE_TAG:-latest}
    container_name: franchise-architect-community-stats
    command: ["node", "src/community/server.js"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      NODE_ENV: production
      PORT: 8082
      DATABASE_URL: postgresql://studio_admin:${POSTGRES_PASSWORD}@postgres:5432/community_stats
      COMMUNITY_KEY_PATH: /var/lib/community-stats/pepper
      COMMUNITY_ALLOWED_ORIGINS: https://playfranchisearchitect.com,https://staging.playfranchisearchitect.com
    volumes:
      - community_stats_keys:/var/lib/community-stats
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - community_internal
      - community_edge

networks:
  community_internal:
    internal: true
  community_edge:
    driver: bridge

volumes:
  postgres_data:
  community_stats_keys: