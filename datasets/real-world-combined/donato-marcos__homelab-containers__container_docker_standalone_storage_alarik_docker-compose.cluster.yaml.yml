name: s3-alarik-cluster

services:
  api01:
    image: ghcr.io/achtungsoftware/alarik:${VERSION:-latest}
    #image: alarik-cluster:latest
    restart: unless-stopped
    env_file:
      - .env.secrets
      - .env.cluster
    environment:
      # URLs públicas (usadas em respostas, links, callbacks OIDC)
      - API_BASE_URL=http://alarik-api.${DOMAIN:-teste.local}
      - CONSOLE_BASE_URL=http://alarik-console.${DOMAIN:-teste.local}
      # Região S3 que os clientes devem assinar nas requests
      - ALARIK_REGION=${ALARIK_REGION:-us-east-1}
      # true = fsync antes de ack (durabilidade); false = throughput (benchmarks)
      - ALARIK_FSYNC=${ALARIK_FSYNC:-true}
      # Nível de log: debug | info | notice | warning | error | critical
      - LOG_LEVEL=${LOG_LEVEL:-info}

      - CLUSTER_NODE_ADDRESS=http://api01-internal:8080
    expose:
      - "8080"
    networks:
      alarik-net:
        interface_name: eth0
        aliases:
          - api01-internal
      traefik_public:
        interface_name: eth1
        aliases:
          - api01-external
    volumes:
      - api01-storage:/app/Storage
    healthcheck:
      # Verifica se a API está respondendo (401 é OK — prova que o servidor está vivo)
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_public}"

      # HTTP router
      - "traefik.http.routers.alarik-api01-http.rule=Host(`alarik-api.${DOMAIN:-teste.local}`)"
      - "traefik.http.routers.alarik-api01-http.entrypoints=web"
      - "traefik.http.routers.alarik-api01-http.service=alarik-api"
      
      ## HTTPS router
      #- "traefik.http.routers.alarik-api01-https.rule=Host(`alarik-api.${DOMAIN:-teste.local}`)"
      #- "traefik.http.routers.alarik-api01-https.entrypoints=websecure"
      #- "traefik.http.routers.alarik-api01-https.tls=true"
      #- "traefik.http.routers.alarik-api01-https.tls.certresolver=${MYRESOLVER:-staging}"
      #- "traefik.http.routers.alarik-api01-https.service=alarik-api"

      # Service
      - "traefik.http.services.alarik-api.loadbalancer.server.port=8080"
      - "traefik.http.services.alarik-api.loadbalancer.healthcheck.path=/readyz"
      - "traefik.http.services.alarik-api.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.alarik-api.loadbalancer.healthcheck.timeout=3s"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

