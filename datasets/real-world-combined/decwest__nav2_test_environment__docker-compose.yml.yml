services:
  nav2_env_gpu:
    build:
      context: ./docker/
      dockerfile: Dockerfile.gpu
      args:
        USER: ${USER}
        USER_ID: ${USER_ID:-1000}
        workspace: "/home/${USER}/ros2_ws"
    image: "${USER}/nav2_env"
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "/home/${USER}/.Xauthority:/home/${USER}/.Xauthority"
      - "/home/${USER}/.gazebo:/home/${USER}/.gazebo"
      - "/home/${USER}/.ros:/home/${USER}/.ros"
      - "${PWD}/docker/initial_setting.sh:/initial_setting.sh"
      - "${PWD}/docker/ros2_ws:/home/${USER}/ros2_ws/"
      - "/etc/group:/etc/group:ro"
      - "/etc/passwd:/etc/passwd:ro"
      - "/etc/localtime:/etc/localtime:ro"
      - "/media:/media"
      - "/dev:/dev"
      - "/lib/modules:/lib/modules:ro"
      - "/etc/udev:/etc/udev:ro"
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
  nav2_env_cpu:
    build:
      context: ./docker/
      dockerfile: Dockerfile.cpu
      args:
        USER: ${USER}
        USER_ID: ${USER_ID:-1000}
        workspace: "/home/${USER}/ros2_ws"
    image: "${USER}/nav2_env"
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "/home/${USER}/.Xauthority:/home/${USER}/.Xauthority"
      - "/home/${USER}/.gazebo:/home/${USER}/.gazebo"
      - "/home/${USER}/.ros:/home/${USER}/.ros"
      - "${PWD}/docker/initial_setting.sh:/initial_setting.sh"
      - "${PWD}/docker/ros2_ws:/home/${USER}/ros2_ws/"
      - "/etc/group:/etc/group:ro"
      - "/etc/passwd:/etc/passwd:ro"
      - "/etc/localtime:/etc/localtime:ro"
      - "/media:/media"
      - "/dev:/dev"
      - "/lib/modules:/lib/modules:ro"
      - "/etc/udev:/etc/udev:ro"
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true

